name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.4"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Tạo Gradle Wrapper nếu thiếu gradle-wrapper.jar
      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar không có, đang tạo..."
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                 -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
              --gradle-version=${GRADLE_VERSION} \
              --distribution-type=bin
            echo "✅ Wrapper đã tạo xong"
          else
            echo "✅ gradle-wrapper.jar có sẵn"
          fi
          chmod +x gradlew

      # 4. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 5. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FileManager-debug-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 6. Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 7. Ký APK — dùng env để check secrets (secrets không dùng được trong if trực tiếp)
      - name: Sign Release APK
        id: sign_apk
        if: env.HAS_SIGNING_KEY == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
          BUILD_TOOLS_VERSION: "34.0.0"

      # 8a. Upload APK đã ký
      - name: Upload Signed Release APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FileManager-release-signed-v${{ github.run_number }}
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          retention-days: 90
        env:
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

      # 8b. Upload APK chưa ký (fallback khi không có keystore)
      - name: Upload Unsigned Release APK
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FileManager-release-unsigned-v${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
        env:
          HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

      # 9. Tạo GitHub Release khi push tag vX.Y.Z
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "FileManager ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
