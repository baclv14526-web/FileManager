name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Wrapper
        run: |
          GRADLE_VERSION=8.6
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading Gradle $GRADLE_VERSION..."
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                 -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
              --gradle-version=${GRADLE_VERSION} \
              --distribution-type=bin
          fi
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # Build Debug — in đầy đủ lỗi Kotlin nếu fail
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -Pkotlin.incremental=false \
            2>&1 | tee build_log.txt
          # Grep chỉ phần lỗi Kotlin để dễ đọc
          echo "=== KOTLIN ERRORS ==="
          grep -E "error:|warning:|\.kt:[0-9]" build_log.txt | head -60 || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FileManager-debug-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Upload build log khi fail để debug
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v${{ github.run_number }}
          path: build_log.txt
          retention-days: 7

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK
        id: sign_apk
        if: env.HAS_KEY == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          HAS_KEY: ${{ secrets.SIGNING_KEY != '' }}
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload Signed Release APK
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FileManager-release-signed-v${{ github.run_number }}
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          retention-days: 90
        env:
          HAS_KEY: ${{ secrets.SIGNING_KEY != '' }}

      - name: Upload Unsigned Release APK
        if: env.HAS_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FileManager-release-unsigned-v${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
        env:
          HAS_KEY: ${{ secrets.SIGNING_KEY != '' }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "FileManager ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
