name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Wrapper
        run: |
          GRADLE_VERSION=8.6
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading Gradle $GRADLE_VERSION..."
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                 -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
              --gradle-version=${GRADLE_VERSION} \
              --distribution-type=bin
          fi
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # Build Debug APK
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FileManager-debug-v${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      # Build Release APK
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List All Built APKs
        run: |
          echo "=== ALL GENERATED APKS ==="
          ls -la app/build/outputs/apk/debug/ || true
          ls -la app/build/outputs/apk/release/ || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FileManager-release-v${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "FileManager ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
